[package]
name = "sharded-slab"
version = "0.1.7"
authors = ["Eliza Weisman <eliza@buoyant.io>"]
edition = "2024"
rust-version = "1.99"
documentation = "https://docs.rs/sharded-slab/"
repository = "https://github.com/hawkw/sharded-slab"
readme = "README.md"
license = "MIT"
keywords = ["slab", "allocator", "lock-free", "atomic"]
categories = ["memory-management", "data-structures", "concurrency"]
description = "A lock-free concurrent slab."
include = ["/src", "/README.md", "/CHANGELOG.md", "/IMPLEMENTATION.md", "/LICENSE"]

[[bench]]
name = "bench"
harness = false

[features]
# Use `loom`'s simulated primitives when built with `--cfg loom`, so that
# downstream `loom` models can include a `Slab` or `Pool`.
loom = ["dep:loom"]

[dev-dependencies]
proptest = "1"
criterion = "0.8"
slab = "0.4"
indexmap = "2"

[target.'cfg(loom)'.dependencies]
loom = { version = "0.7", features = ["checkpoint"], optional = true }

[target.'cfg(loom)'.dev-dependencies]
loom = { version = "0.7", features = ["checkpoint"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(slab_print)', 'cfg(docsrs)'] }

[lints.rustdoc]
broken_intra_doc_links = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
